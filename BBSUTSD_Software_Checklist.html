<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BBSUTSD Software Checklist — 32 × 25</title>
  <style>
    :root {
      --brown: #6B3B21;
      --brown-dark: #4a2a16;
      --dark: #1a1816;
      --olive: #8fa85a;
      --olive-dark: #6a823c;
      --cream: #faf7f2;
      --cream2: #f3efe7;
      --line: #d4cdc0;
      --muted: #6b6560;
      --white: #ffffff;
      --header-h: 56px;
      --toolbar-h: 38px;
      --stats-h: 26px;
      --footer-h: 40px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--cream);
      color: var(--dark);
      font-size: 12px;
      -webkit-tap-highlight-color: transparent;
    }
    .app {
      display: grid;
      grid-template-rows: var(--header-h) var(--toolbar-h) var(--stats-h) 1fr var(--footer-h);
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      max-height: 100dvh;
    }

    /* HEADER */
    .header {
      display: flex; align-items: center; gap: 10px;
      padding: 0 10px;
      background: linear-gradient(180deg, #fff 0%, var(--cream) 100%);
      border-bottom: 2px solid var(--brown);
      position: relative;
      min-height: 0;
    }
    .header::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0;
      height: 3px; background: var(--brown);
    }
    .logo { height: 44px; width: auto; flex-shrink: 0; }
    .header-text { flex: 1; min-width: 0; line-height: 1.15; }
    .header-text h1 {
      font-size: 14px; font-weight: 700; color: var(--dark); letter-spacing: 0.2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .header-text .sub { font-size: 10.5px; color: var(--brown); font-weight: 600; }
    .header-text .uni { font-size: 9.5px; color: var(--muted); }

    .meta { display: flex; gap: 7px; flex-shrink: 0; }
    .meta-field { display: flex; flex-direction: column; gap: 1px; }
    .meta-field label {
      font-size: 8.5px; font-weight: 700; color: var(--brown);
      text-transform: uppercase; letter-spacing: 0.3px;
    }
    .meta-field input {
      width: 100px; border: 1px solid var(--line); border-radius: 4px;
      background: var(--white); padding: 2px 5px; font-size: 11px;
      outline: none; color: var(--dark);
    }
    .meta-field input:focus {
      border-color: var(--brown);
      box-shadow: 0 0 0 2px rgba(107,59,33,0.12);
    }
    .meta-field input[type="date"] { width: 112px; }

    /* TOOLBAR */
    .toolbar {
      display: flex; align-items: center; gap: 5px;
      padding: 0 8px;
      background: var(--cream2);
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .toolbar button, .toolbar label.file-btn {
      display: inline-flex; align-items: center; gap: 3px;
      height: 26px; padding: 0 9px;
      font-size: 11px; font-weight: 600;
      border-radius: 5px; border: 1px solid transparent;
      cursor: pointer; font-family: inherit;
      transition: background 0.12s, border-color 0.12s;
      white-space: nowrap; flex-shrink: 0;
    }
    .btn-primary { background: var(--brown); color: #fff; }
    .btn-primary:hover, .btn-primary:active { background: var(--brown-dark); }
    .btn-ghost { background: var(--white); color: var(--dark); border-color: var(--line); }
    .btn-ghost:hover, .btn-ghost:active { border-color: var(--brown); }
    .btn-olive { background: var(--olive); color: var(--dark); }
    .btn-olive:hover, .btn-olive:active { background: var(--olive-dark); color: #fff; }
    .btn-danger { background: #9b3b3b; color: #fff; }
    .btn-danger:hover, .btn-danger:active { background: #7a2e2e; }

    .status {
      margin-left: auto; font-size: 10.5px; color: var(--muted);
      font-style: italic; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; max-width: 200px;
      flex-shrink: 1;
    }
    .status.ok { color: #2d6a2d; font-style: normal; }
    .status.err { color: #9b3b3b; font-style: normal; }

    /* STATS */
    .stats {
      display: flex; align-items: center; gap: 10px;
      padding: 0 10px; background: #fff;
      border-bottom: 1px solid var(--line); font-size: 11px;
    }
    .stats strong { color: var(--brown); font-size: 12px; }
    .bar {
      flex: 1; max-width: 240px; height: 7px;
      background: #e5e0d6; border-radius: 4px; overflow: hidden;
    }
    .bar > i {
      display: block; height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--olive), #5a8a30);
      transition: width 0.2s ease;
    }

    /* DESKTOP TABLE */
    .table-area {
      overflow: hidden; display: flex; flex-direction: column;
      min-height: 0; background: var(--white);
      position: relative;
    }
    .desktop-view { display: flex; flex-direction: column; height: 100%; min-height: 0; }
    .mobile-view { display: none; flex-direction: column; height: 100%; min-height: 0; }

    table.grid {
      width: 100%; height: 100%;
      border-collapse: collapse; table-layout: fixed;
      font-size: 10.5px;
    }
    thead { background: var(--brown); color: #fff; }
    thead th {
      font-weight: 600; padding: 2px 0;
      text-align: center; border: 1px solid var(--brown-dark);
      vertical-align: middle; line-height: 1.05;
    }
    thead th.num {
      width: 24px; position: sticky; left: 0; z-index: 5; background: var(--brown);
    }
    thead th.sw {
      width: 118px; text-align: left; padding-left: 5px;
      position: sticky; left: 24px; z-index: 5; background: var(--brown);
    }
    thead th .n { display: block; font-size: 9.5px; font-weight: 700; }
    thead th .l { display: block; font-size: 7.5px; opacity: 0.8; }
    thead th input[type="checkbox"] {
      width: 10px; height: 10px; margin-top: 1px;
      accent-color: #e8d5b5; cursor: pointer;
    }

    tbody td {
      border: 1px solid var(--line); text-align: center;
      vertical-align: middle; padding: 0;
    }
    tbody tr:nth-child(even) td { background: var(--cream2); }
    tbody tr:nth-child(odd) td { background: var(--cream); }
    tbody tr:hover td { background: #eaf2d8; }

    tbody td.num {
      width: 24px; font-weight: 700; font-size: 9.5px;
      position: sticky; left: 0; z-index: 3;
      background: inherit; border-right: 2px solid var(--line);
    }
    tbody td.sw {
      width: 118px; text-align: left; padding: 0 5px;
      font-weight: 500; font-size: 10px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      position: sticky; left: 24px; z-index: 3;
      background: inherit; border-right: 2px solid var(--line);
    }

    .cell {
      display: flex; align-items: center; justify-content: center;
      width: 100%; height: 100%; min-height: 16px;
    }
    input[type="checkbox"] {
      width: 12px; height: 12px; cursor: pointer;
      accent-color: var(--brown); margin: 0;
    }

    /* MOBILE VIEW */
    .pc-picker {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px;
      background: var(--cream2);
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }
    .pc-picker label {
      font-weight: 700; color: var(--brown); font-size: 12px;
      white-space: nowrap;
    }
    .pc-picker select {
      flex: 1; height: 36px; border: 1px solid var(--line);
      border-radius: 8px; padding: 0 10px; font-size: 14px;
      background: var(--white); color: var(--dark);
      font-weight: 600; outline: none;
    }
    .pc-picker select:focus { border-color: var(--brown); }
    .pc-nav {
      display: flex; gap: 4px;
    }
    .pc-nav button {
      width: 36px; height: 36px; border-radius: 8px;
      border: 1px solid var(--line); background: var(--white);
      font-size: 16px; cursor: pointer; color: var(--dark);
      display: flex; align-items: center; justify-content: center;
    }
    .pc-nav button:active { background: var(--cream); }

    .mobile-list {
      flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
      min-height: 0;
    }
    .m-row {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      min-height: 48px;
    }
    .m-row:nth-child(even) { background: var(--cream2); }
    .m-row:nth-child(odd) { background: var(--cream); }
    .m-row:active { background: #eaf2d8; }
    .m-num {
      width: 28px; font-weight: 700; font-size: 12px;
      color: var(--muted); text-align: center; flex-shrink: 0;
    }
    .m-name {
      flex: 1; font-size: 14px; font-weight: 500;
      min-width: 0;
    }
    .m-check {
      flex-shrink: 0;
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
    }
    .m-check input[type="checkbox"] {
      width: 22px; height: 22px;
    }
    .m-all-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px;
      background: var(--brown);
      color: #fff;
      flex-shrink: 0;
    }
    .m-all-bar span { font-size: 13px; font-weight: 600; }
    .m-all-bar label {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; cursor: pointer;
    }
    .m-all-bar input[type="checkbox"] {
      width: 20px; height: 20px; accent-color: #e8d5b5;
    }

    /* FOOTER */
    .footer {
      display: flex; align-items: center; gap: 8px;
      padding: 0 10px;
      padding-bottom: var(--safe-bottom);
      background: var(--cream2);
      border-top: 2px solid var(--brown); font-size: 11px;
    }
    .sig { display: flex; align-items: center; gap: 5px; flex: 1; min-width: 0; }
    .sig label {
      font-weight: 700; color: var(--brown); white-space: nowrap; font-size: 9.5px;
    }
    .sig input {
      flex: 1; min-width: 0; border: none; border-bottom: 1px solid var(--line);
      background: transparent; padding: 2px 3px; font-size: 11px; outline: none;
    }
    .sig input:focus { border-bottom-color: var(--brown); }
    .foot-note {
      color: var(--muted); font-size: 9px; white-space: nowrap; margin-left: 6px;
    }

    /* ========== RESPONSIVE ========== */

    /* Tablet: allow horizontal scroll on table */
    @media (max-width: 1100px) {
      :root {
        --header-h: 52px;
      }
      .desktop-view { overflow: auto; -webkit-overflow-scrolling: touch; }
      table.grid {
        width: max-content; min-width: 100%;
        height: auto;
      }
      thead th, tbody td { min-width: 28px; }
      thead th.sw, tbody td.sw { min-width: 130px; width: 130px; }
      thead th.num, tbody td.num { min-width: 28px; width: 28px; }
      .cell { min-height: 28px; }
      input[type="checkbox"] { width: 14px; height: 14px; }
      .header-text .uni { display: none; }
    }

    /* Mobile: switch to PC-picker + list */
    @media (max-width: 720px) {
      :root {
        --header-h: auto;
        --toolbar-h: 42px;
        --stats-h: 30px;
        --footer-h: auto;
      }
      .app {
        grid-template-rows: auto var(--toolbar-h) var(--stats-h) 1fr auto;
      }
      .header {
        flex-wrap: wrap;
        padding: 8px 10px 6px;
        gap: 6px;
      }
      .logo { height: 36px; }
      .header-text h1 { font-size: 13px; }
      .header-text .sub { font-size: 10px; }
      .header-text .uni { display: none; }
      .meta {
        width: 100%;
        justify-content: space-between;
      }
      .meta-field input {
        width: 100%;
        min-width: 0;
        height: 32px;
        font-size: 13px;
        padding: 4px 8px;
      }
      .meta-field { flex: 1; }
      .meta-field input[type="date"] { width: 100%; }

      .toolbar {
        padding: 0 6px;
        gap: 4px;
      }
      .toolbar button, .toolbar label.file-btn {
        height: 32px; padding: 0 8px; font-size: 11px;
      }
      .status { max-width: 100px; font-size: 10px; }

      .stats { font-size: 12px; gap: 8px; }
      .bar { max-width: none; }

      /* hide desktop grid, show mobile list */
      .desktop-view { display: none !important; }
      .mobile-view { display: flex !important; }

      .footer {
        flex-wrap: wrap;
        padding: 6px 10px;
        padding-bottom: calc(6px + var(--safe-bottom));
        gap: 6px;
      }
      .sig { width: 100%; flex: none; }
      .sig label { font-size: 10px; min-width: 70px; }
      .sig input { height: 28px; font-size: 13px; }
      .foot-note { display: none; }
    }

    /* Very small phones */
    @media (max-width: 380px) {
      .header-text h1 { font-size: 12px; }
      .toolbar button, .toolbar label.file-btn {
        padding: 0 6px; font-size: 10px;
      }
      .m-name { font-size: 13px; }
    }

    @media print {
      html, body { overflow: visible; height: auto; }
      .app { height: auto; grid-template-rows: auto auto auto auto auto; }
      .toolbar, .status, .mobile-view { display: none !important; }
      .desktop-view { display: flex !important; overflow: visible; }
      .table-area { overflow: visible; }
      table.grid { width: 100%; height: auto; }
      thead th { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>

        </div>
        <div class="m-all-bar">
          <span id="mPcLabel">PC 01</span>
          <label>
            <input type="checkbox" id="mSelectAll" onchange="mobileSelectAll(this.checked)" />
            All softwares
          </label>
        </div>
        <div class="mobile-list" id="mobileList"></div>
      </div>
    </div>

    <footer class="footer">
      <div class="sig">
        <label>Technician</label>
        <input type="text" id="sigTech" placeholder="Name / Sign" />
      </div>
      <div class="sig">
        <label>Faculty</label>
        <input type="text" id="sigFaculty" placeholder="Name / Sign" />
      </div>
      <div class="sig">
        <label>HOD</label>
        <input type="text" id="sigHOD" placeholder="Name / Sign" />
      </div>
      <span class="foot-note">BBSUTSD · Khairpur Mirs · Tick installed software per PC</span>
    </footer>
  </div>

  <script>
    const SOFTWARES = [
      "Java","Python","Node.js","Dev-C++","Eclipse","Android Studio","Figma","Arduino IDE",
      "MySQL","VS Code","Visual Studio 2022","SSMS","Xilinx Vivado","IntelliJ IDEA","MATLAB",
      "Multisim","Miniconda","MS Office","VirtualBox / VMware","Git","Postman","WinRAR",
      "Notepad++","Wireshark","PuTTY","Emu8086","Adobe XD","Flutter","PyCharm IDE",
      "Cisco Packet Tracer","XAMPP","Proteus Design Suite"
    ];
    const PC_COUNT = 25;
    const STORAGE_KEY = "bbsutsd_checklist_v2";
    let state = [];
    let currentPc = 0; // for mobile view

    function init() {
      document.getElementById("checkDate").value = new Date().toISOString().slice(0, 10);
      state = SOFTWARES.map(() => Array(PC_COUNT).fill(false));
      buildDesktopTable();
      buildMobileUi();
      loadLocal();
      updateStats();
      bindMeta();
      syncMobileFromState();
    }

    /* ── DESKTOP GRID ── */
    function buildDesktopTable() {
      const header = document.getElementById("headerRow");
      const body = document.getElementById("tableBody");
      header.innerHTML = "";
      body.innerHTML = "";

      const thNum = document.createElement("th");
      thNum.className = "num";
      thNum.textContent = "#";
      header.appendChild(thNum);

      const thSw = document.createElement("th");
      thSw.className = "sw";
      thSw.textContent = "SOFTWARE";
      header.appendChild(thSw);

      for (let p = 0; p < PC_COUNT; p++) {
        const th = document.createElement("th");
        th.innerHTML = `<span class="n">${String(p+1).padStart(2,"0")}</span><span class="l">PC</span>`;
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.title = "Toggle all for PC " + (p+1);
        cb.dataset.pc = p;
        cb.id = `col-all-${p}`;
        cb.addEventListener("change", e => {
          const pc = +e.target.dataset.pc;
          const on = e.target.checked;
          state.forEach((row, si) => {
            row[pc] = on;
            const box = document.getElementById(`c-${si}-${pc}`);
            if (box) box.checked = on;
          });
          if (pc === currentPc) syncMobileFromState();
          persist();
          updateStats();
        });
        th.appendChild(cb);
        header.appendChild(th);
      }

      SOFTWARES.forEach((name, si) => {
        const tr = document.createElement("tr");
        const tdNum = document.createElement("td");
        tdNum.className = "num";
        tdNum.textContent = si + 1;
        tr.appendChild(tdNum);

        const tdSw = document.createElement("td");
        tdSw.className = "sw";
        tdSw.textContent = name;
        tdSw.title = name;
        tr.appendChild(tdSw);

        for (let p = 0; p < PC_COUNT; p++) {
          const td = document.createElement("td");
          const cell = document.createElement("div");
          cell.className = "cell";
          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.id = `c-${si}-${p}`;
          cb.dataset.sw = si;
          cb.dataset.pc = p;
          cb.checked = state[si][p];
          cb.addEventListener("change", onCheck);
          cell.appendChild(cb);
          td.appendChild(cell);
          tr.appendChild(td);
        }
        body.appendChild(tr);
      });
      document.getElementById("totalCount").textContent = SOFTWARES.length * PC_COUNT;
    }

    function onCheck(e) {
      const si = +e.target.dataset.sw;
      const pc = +e.target.dataset.pc;
      state[si][pc] = e.target.checked;
      if (pc === currentPc) {
        const mcb = document.getElementById(`m-${si}`);
        if (mcb) mcb.checked = e.target.checked;
        updateMobileSelectAll();
      }
      persist();
      updateStats();
    }

    /* ── MOBILE LIST ── */
    function buildMobileUi() {
      const sel = document.getElementById("pcSelect");
      sel.innerHTML = "";
      for (let p = 0; p < PC_COUNT; p++) {
        const opt = document.createElement("option");
        opt.value = p;
        opt.textContent = "PC " + String(p + 1).padStart(2, "0");
        sel.appendChild(opt);
      }

      const list = document.getElementById("mobileList");
      list.innerHTML = "";
      SOFTWARES.forEach((name, si) => {
        const row = document.createElement("div");
        row.className = "m-row";
        row.innerHTML =
          `<span class="m-num">${si + 1}</span>` +
          `<span class="m-name">${name}</span>` +
          `<span class="m-check"><input type="checkbox" id="m-${si}" data-sw="${si}" /></span>`;
        const cb = row.querySelector("input");
        cb.addEventListener("change", e => {
          const s = +e.target.dataset.sw;
          state[s][currentPc] = e.target.checked;
          const desk = document.getElementById(`c-${s}-${currentPc}`);
          if (desk) desk.checked = e.target.checked;
          updateMobileSelectAll();
          persist();
          updateStats();
        });
        list.appendChild(row);
      });
    }

    function onMobilePcChange() {
      currentPc = +document.getElementById("pcSelect").value;
      syncMobileFromState();
    }

    function shiftPc(dir) {
      currentPc = (currentPc + dir + PC_COUNT) % PC_COUNT;
      document.getElementById("pcSelect").value = currentPc;
      syncMobileFromState();
    }

    function syncMobileFromState() {
      document.getElementById("mPcLabel").textContent =
        "PC " + String(currentPc + 1).padStart(2, "0");
      SOFTWARES.forEach((_, si) => {
        const cb = document.getElementById(`m-${si}`);
        if (cb) cb.checked = !!state[si][currentPc];
      });
      updateMobileSelectAll();
    }

    function updateMobileSelectAll() {
      const all = state.every(row => row[currentPc]);
      const el = document.getElementById("mSelectAll");
      if (el) el.checked = all;
    }

    function mobileSelectAll(on) {
      state.forEach((row, si) => {
        row[currentPc] = on;
        const m = document.getElementById(`m-${si}`);
        if (m) m.checked = on;
        const d = document.getElementById(`c-${si}-${currentPc}`);
        if (d) d.checked = on;
      });
      const col = document.getElementById(`col-all-${currentPc}`);
      if (col) col.checked = on;
      persist();
      updateStats();
    }

    /* ── SHARED ── */
    function updateStats() {
      let n = 0;
      const total = SOFTWARES.length * PC_COUNT;
      state.forEach(r => r.forEach(v => { if (v) n++; }));
      document.getElementById("checkedCount").textContent = n;
      const pct = total ? Math.round(n / total * 100) : 0;
      document.getElementById("pct").textContent = pct + "%";
      document.getElementById("progressBar").style.width = pct + "%";
    }

    function getMeta() {
      return {
        labRoom: document.getElementById("labRoom").value.trim(),
        checkDate: document.getElementById("checkDate").value,
        preparedBy: document.getElementById("preparedBy").value.trim(),
        sigTech: document.getElementById("sigTech").value.trim(),
        sigFaculty: document.getElementById("sigFaculty").value.trim(),
        sigHOD: document.getElementById("sigHOD").value.trim()
      };
    }
    function setMeta(m) {
      if (!m) return;
      ["labRoom","checkDate","preparedBy","sigTech","sigFaculty","sigHOD"].forEach(k => {
        if (m[k] != null) document.getElementById(k).value = m[k];
      });
    }

    function persist() {
      const payload = {
        version: 2, softwares: SOFTWARES, pcCount: PC_COUNT,
        state, meta: getMeta(), savedAt: new Date().toISOString()
      };
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
        document.getElementById("lastSaved").textContent = new Date().toLocaleTimeString();
        setStatus("Auto-saved", "ok");
      } catch (e) { setStatus("Save failed", "err"); }
    }

    function loadLocal() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        applyData(JSON.parse(raw));
        setStatus("Session restored", "ok");
      } catch (e) {}
    }

    function bindMeta() {
      ["labRoom","checkDate","preparedBy","sigTech","sigFaculty","sigHOD"].forEach(id => {
        const el = document.getElementById(id);
        el.addEventListener("change", persist);
        el.addEventListener("blur", persist);
      });
    }

    function buildLogText() {
      const meta = getMeta();
      const now = new Date();
      const lines = [];
      lines.push("============================================================");
      lines.push("  BBSUTSD — Software Installation Checklist LOG");
      lines.push("  Benazir Bhutto Shaheed University of Technology");
      lines.push("  and Skill Development — Khairpur Mirs");
      lines.push("============================================================");
      lines.push("");
      lines.push("Generated : " + now.toLocaleString());
      lines.push("Lab/Room  : " + (meta.labRoom || "—"));
      lines.push("Date      : " + (meta.checkDate || "—"));
      lines.push("Prepared  : " + (meta.preparedBy || "—"));
      lines.push("");
      lines.push("------------------------------------------------------------");
      SOFTWARES.forEach((name, si) => {
        lines.push("[" + String(si+1).padStart(2,"0") + "] " + name);
        const pcs = [];
        for (let p = 0; p < PC_COUNT; p++) {
          pcs.push("PC" + String(p+1).padStart(2,"0") + ":" + (state[si][p] ? "✓" : " "));
        }
        for (let i = 0; i < pcs.length; i += 8) {
          lines.push("     " + pcs.slice(i, i+8).join("  "));
        }
        lines.push("");
      });
      lines.push("------------------------------------------------------------");
      lines.push("Lab In-Charge : " + (meta.sigTech || "—"));
      lines.push("Faculty       : " + (meta.sigFaculty || "—"));
      lines.push("HOD           : " + (meta.sigHOD || "—"));
      lines.push("------------------------------------------------------------");
      lines.push("");
      lines.push("--- MACHINE READABLE JSON (do not edit below this line) ---");
      lines.push(JSON.stringify({
        version: 2, softwares: SOFTWARES, pcCount: PC_COUNT,
        state, meta, savedAt: now.toISOString()
      }));
      lines.push("--- END ---");
      return lines.join("\n");
    }

    function saveToLog() {
      const text = buildLogText();
      const meta = getMeta();
      const datePart = (meta.checkDate || new Date().toISOString().slice(0,10)).replace(/-/g,"");
      const roomPart = (meta.labRoom || "Lab").replace(/[^a-zA-Z0-9_-]/g,"_").slice(0,20);
      const filename = "BBSUTSD_Checklist_" + roomPart + "_" + datePart + ".log";
      const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      persist();
      setStatus("Saved " + filename, "ok");
    }

    function loadFromLog(ev) {
      const file = ev.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const text = e.target.result;
          const marker = "--- MACHINE READABLE JSON (do not edit below this line) ---";
          const idx = text.indexOf(marker);
          let data;
          if (idx !== -1) {
            data = JSON.parse(text.slice(idx + marker.length).replace("--- END ---","").trim());
          } else {
            data = JSON.parse(text);
          }
          applyData(data);
          setStatus("Loaded " + file.name, "ok");
        } catch (err) {
          setStatus("Load failed", "err");
          alert("Could not parse the .log file.");
        }
        ev.target.value = "";
      };
      reader.readAsText(file);
    }

    function applyData(data) {
      if (!data || !data.state) throw new Error("bad format");
      const map = {};
      SOFTWARES.forEach((n,i) => map[n] = i);
      state = SOFTWARES.map(() => Array(PC_COUNT).fill(false));
      data.state.forEach((row, oldSi) => {
        const name = (data.softwares && data.softwares[oldSi]) || SOFTWARES[oldSi];
        const si = map[name];
        if (si === undefined) return;
        row.forEach((v, pc) => {
          if (pc < PC_COUNT) state[si][pc] = !!v;
        });
      });
      for (let si = 0; si < SOFTWARES.length; si++) {
        for (let p = 0; p < PC_COUNT; p++) {
          const box = document.getElementById("c-" + si + "-" + p);
          if (box) box.checked = state[si][p];
        }
      }
      if (data.meta) setMeta(data.meta);
      syncMobileFromState();
      persist();
      updateStats();
    }

    function clearAll() {
      if (!confirm("Clear all checkboxes?")) return;
      state = SOFTWARES.map(() => Array(PC_COUNT).fill(false));
      for (let si = 0; si < SOFTWARES.length; si++) {
        for (let p = 0; p < PC_COUNT; p++) {
          const box = document.getElementById("c-" + si + "-" + p);
          if (box) box.checked = false;
        }
      }
      document.querySelectorAll("thead input[type=checkbox]").forEach(c => c.checked = false);
      syncMobileFromState();
      persist();
      updateStats();
      setStatus("Cleared", "ok");
    }

    function exportSummary() {
      const meta = getMeta();
      const lines = ["BBSUTSD Checklist — " + (meta.labRoom || "Lab") + " — " + (meta.checkDate || ""), ""];
      SOFTWARES.forEach((name, si) => {
        const pcs = [];
        state[si].forEach((v,p) => { if (v) pcs.push("PC" + String(p+1).padStart(2,"0")); });
        lines.push(name + ": " + (pcs.length ? pcs.join(", ") : "(none)"));
      });
      const text = lines.join("\n");
      navigator.clipboard.writeText(text).then(() => setStatus("Summary copied", "ok"))
        .catch(() => prompt("Copy:", text));
    }

    function setStatus(msg, type) {
      const el = document.getElementById("status");
      el.textContent = msg;
      el.className = "status" + (type ? " " + type : "");
    }

    init();
  </script>
</body>
</html>
